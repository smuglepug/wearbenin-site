<title>WearBenin · Benin City fashion marketplace</title>

<style>
  body{font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;
       display:grid;place-items:center;background:#F3F4F6;color:#111827}
  p{max-width:32ch;text-align:center;color:#4B5563}
  b{color:#111827}
</style>
<script>
/* ---------------------------------------------------------------------------
   GitHub Pages serves THIS file (with a 404 status) for any path it doesn't
   have on disk. The app is hash-routed, so a path URL like
   /wearbenin-site/login would otherwise dead-end on a bare 404 page.

   Rewrite the path into the equivalent hash route and reload, so every link
   that uses a path works:  /<repo>/login  ->  /<repo>/#/login
   --------------------------------------------------------------------------- */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var base = parts.length ? '/' + parts[0] + '/' : '/';
  var rest = location.pathname.slice(base.length).replace(/index\.html$/, '');
  var hash = rest ? '#/' + rest : '#/';
  location.replace(base + location.search + hash);
})();
</script>
</head>

  <p><b>WearBenin</b><br>Taking you to the marketplace&hellip;</p>
  <noscript><p>Please enable JavaScript, or go to <a href="./">the home page</a>.</p></noscript>
</body>
